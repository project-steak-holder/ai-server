[project]
name = "ai-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.135.2",
    "psycopg[binary]>=3.3.3",
    "pydantic-ai-slim[openai]>=1.74.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.48",
    "PyJWT>=2.11.0",
    "cryptography>=46.0.6",
    "axiom-py>=0.10.0"
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
    "types-jmespath",
]

[tool.mypy]
check_untyped_defs = true

[tool.ruff]
exclude = ["venv", ".git"]

[tool.ruff.lint]
ignore = ["F402"]
