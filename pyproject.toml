[project]
name = "ai-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.135.3",
    "psycopg[binary]>=3.3.3",
    "pydantic-ai-slim[google]>=1.78.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "PyJWT>=2.11.0",
    "cryptography>=46.0.7",
    "axiom-py>=0.10.0",
    "greenlet==3.4.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
    "aiosqlite>=0.21.0",
]

[tool.mypy]
check_untyped_defs = true

[tool.ruff]
exclude = ["venv", ".git"]

[tool.ruff.lint]
ignore = ["F402"]
